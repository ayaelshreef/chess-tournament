name = "chess-tournament"
main = "backend/cloudflare.js"
compatibility_date = "2026-11-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[assets]
directory = "./frontend"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "school-chess-tournament"
